# SL Tech Radar — local stack
# Usage:  docker compose up -d db        # Postgres only (run backend from IDE/Maven)
#         docker compose up --build      # Postgres + backend container

services:
  db:
    image: postgres:16-alpine
    container_name: sl-tech-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sltechradar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar-dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d sltechradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the backend itself in Docker (default profile -> Postgres).
  # API keys are passed through from your shell environment — never baked in.
  backend:
    build: .
    container_name: sl-tech-radar-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: sltechradar
      DB_USER: radar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-radar-dev}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    profiles: ["app"]   # start with:  docker compose --profile app up --build

volumes:
  pgdata:
