# =============================================================================
# SL Tech Radar — default profile: PostgreSQL (see docker-compose.yml).
# Run with:  SPRING_PROFILES_ACTIVE=dev  for the H2 dev profile (no Docker).
# =============================================================================
server.port=${PORT:8080}

# --- PostgreSQL (Docker Compose default) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sltechradar}
spring.datasource.username=${DB_USER:radar}
spring.datasource.password=${DB_PASSWORD:radar-dev}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Provider fallback chain (override order with APP_PROVIDERS_ORDER) ---
# e.g. APP_PROVIDERS_ORDER=groq,nebius,gemini,ollama,template
app.providers-order=${APP_PROVIDERS_ORDER:nebius,groq,gemini,ollama,template}

# Model picks (override per provider as needed)
app.providers.nebius.model=${NEBIUS_MODEL:meta-llama/Llama-3.3-70B-Instruct}
app.providers.nebius.base-url=${NEBIUS_BASE_URL:https://api.tokenfactory.nebius.com/v1}
app.providers.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
app.providers.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.providers.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
app.providers.ollama.model=${OLLAMA_MODEL:llama3.1:8b}

# --- Tavily search ---
app.tavily.base-url=${TAVILY_BASE_URL:https://api.tavily.com}
app.tavily.max-results=${TAVILY_MAX_RESULTS:10}
app.tavily.time-range=${TAVILY_TIME_RANGE:week}
app.tavily.search-depth=${TAVILY_SEARCH_DEPTH:basic}

# --- LangSmith (tracing active only when LANGSMITH_API_KEY is set) ---
app.langsmith.project=${LANGSMITH_PROJECT:sl-tech-radar}
app.langsmith.dataset-id=${LANGSMITH_DATASET_ID:}

# --- Mock mode: seed curated samples when no real AI keys are configured ---
app.mock.enabled=${APP_MOCK_ENABLED:true}

logging.level.lk.sltech.radar=INFO
