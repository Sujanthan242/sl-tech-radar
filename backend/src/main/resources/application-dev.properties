# =============================================================================
# SL Tech Radar — dev profile: H2 in-memory, zero external dependencies.
# Run with:  SPRING_PROFILES_ACTIVE=dev mvn spring-boot:run
# (or: ./mvnw -Dspring-boot.run.profiles=dev spring-boot:run)
# With no provider keys set, the app boots in mock mode: curated samples,
# template drafts, 3 seeded ledger events — every endpoint works.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:sltechradar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

app.mock.enabled=true
logging.level.lk.sltech.radar=DEBUG
